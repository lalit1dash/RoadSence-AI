version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: roadsense-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: roadsense
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - roadsense-net

  backend:
    image: python:3.11-slim
    container_name: roadsense-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DB_NAME=roadsense
      - SECRET_KEY=change-me-in-production
      - CORS_ORIGINS=http://localhost:5173
      - UPLOAD_DIR=uploads
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      sh -c "pip install -r requirements.txt --quiet &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - roadsense-net

  frontend:
    image: node:20-alpine
    container_name: roadsense-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - roadsense-net

volumes:
  mongodb_data:
  backend_uploads:
  frontend_node_modules:

networks:
  roadsense-net:
    driver: bridge
